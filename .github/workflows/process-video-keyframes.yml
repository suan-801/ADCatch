name: ADCatcher Process Video Keyframes (Manual)

# 운영 중 keyframe_status=PENDING(또는 재시도 대상 FAILED→PENDING으로 되돌린) 소재를 Daily
# Collection의 다음 회차를 기다리지 않고 즉시 처리하고 싶을 때 수동으로 실행한다.
# scripts/process_pending_video_keyframes.py(app.services.pending_video_keyframes 재사용)를
# 그대로 실행한다 — Core Collection(actor 실행/ad_sync)은 전혀 건드리지 않는다.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 처리할 최대 소재 수(비우면 기본 배치 크기)"
        required: false
        type: string
      competitor_id:
        description: "이 경쟁사(브랜드) UUID의 PENDING 소재만 처리(비우면 전체 경쟁사 대상)"
        required: false
        type: string

# daily-collect.yml과 동일한 그룹 — 스케줄/수동 Daily Collection과 겹쳐 같은 PENDING 소재를
# 동시에 처리하지 않도록 한다(둘 다 순서대로 큐잉되며, 서로를 취소하지 않는다).
concurrency:
  group: video-keyframes-and-collection

jobs:
  process-keyframes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg/ffprobe
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Process pending video keyframes
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.competitor_id }}" ]; then ARGS="$ARGS --competitor-id ${{ inputs.competitor_id }}"; fi
          python -m scripts.process_pending_video_keyframes $ARGS
